name: Build, smoke, release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging and MCPB runtime test frontends
        run: python -m pip install build uv

      - name: Run conventional unit tests
        run: python -m unittest discover -s tests\unit -p "test_*.py" -v

      - name: Compile source modules
        run: python -m compileall -q addon scripts tests

      - name: Run deterministic Python smoke manifest
        run: python scripts/run_smoke_suite.py --lane release --environment python

      - name: Run offline reference-modeling benchmark regression gate
        run: python scripts/reference_benchmark_regression.py

      - name: Build blender-bridge wheel and source distribution
        run: python -m build

      - name: Build deterministic Claude Desktop MCPB connector
        run: python scripts\build_mcpb.py --stage-dir build\mcpb-stage

      - name: Validate MCPB metadata with the official toolchain
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate build\mcpb-stage

      - name: Smoke MCPB through its host-managed uv runtime
        run: uv run --directory build\mcpb-stage src\main.py --version

      - name: Smoke installed blender-bridge wheel
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          .\.wheel-smoke\Scripts\python.exe -m pip install --no-index --no-deps (Get-ChildItem dist\blender_bridge-*.whl | Select-Object -First 1).FullName
          $env:BLENDER_BRIDGE_EXECUTABLE = (Resolve-Path .\.wheel-smoke\Scripts\blender-bridge.exe).Path
          .\.wheel-smoke\Scripts\blender-bridge.exe --version
          python -m unittest tests.unit.test_mcp_stdio -v

      - name: Upload blender-bridge Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: blender-bridge-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload tagged blender-bridge publication candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: blender-bridge-official-python-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload tagged MCPB publication candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: blender-agent-bridge-official-mcpb-candidate
          path: |
            dist/*.mcpb
            dist/*.mcpb.sha256
          if-no-files-found: error

      - name: Build extension zip and GitHub Pages repository
        run: >
          python scripts\build_extension_repository.py
          --build-zip
          --repo-dir public
          --repository-url https://callmejones.github.io/blender-agent-bridge/index.json

      - name: Verify release and Pages archive identity
        run: python scripts/run_smoke_suite.py --lane artifacts --environment python

      - name: Upload Python-built smoke archive
        uses: actions/upload-artifact@v7
        with:
          name: blender-agent-bridge-python-smoke-archive
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.mcpb

      - name: Upload Python-built repository smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: blender-agent-bridge-python-smoke-repository
          path: |
            public/index.json
            public/index.html
            public/*.zip
            public/*.sha256
            public/assets/**

  blender-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender_series: "4.2"
            blender_version: "4.2.0"
            release_builder: false
          - blender_series: "4.5"
            blender_version: "4.5.0"
            release_builder: false
          - blender_series: "5.1"
            blender_version: "5.1.2"
            release_builder: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: blender
          key: blender-${{ matrix.blender_version }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender${{ matrix.blender_series }}/blender-${{ matrix.blender_version }}-linux-x64.tar.xz"
          echo "Downloading $url"
          curl -fsSL "$url" -o blender.tar.xz
          mkdir -p blender
          tar -xJf blender.tar.xz -C blender --strip-components=1
          rm blender.tar.xz

      - name: Install headless GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 xvfb

      - name: Install MCPB runtime smoke dependency
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -m pip install uv

      - name: Show Blender version
        run: ./blender/blender --version

      - name: Run Blender smoke manifest (complete suite on tags)
        run: |
          set -euo pipefail
          lane=core
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then lane=release; fi
          xvfb-run -a python3 scripts/run_smoke_suite.py --lane "$lane" --environment blender --blender "$GITHUB_WORKSPACE/blender/blender"

      - name: Run clean installed-extension live smoke for tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          xvfb-run -a python3 scripts/installed_extension_live_smoke.py
          --blender "$GITHUB_WORKSPACE/blender/blender"
          --skip-viewport
          --skip-playblast
          --timeout 240

      - name: Validate and build official tagged archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.release_builder
        run: |
          set -euo pipefail
          ./blender/blender --command extension validate addon/claude_blender
          python3 scripts/build_extension_zip.py --blender "$GITHUB_WORKSPACE/blender/blender"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('addon/claude_blender/blender_manifest.toml','rb'))['version'])")
          ./blender/blender --command extension validate "dist/claude_blender-${version}.zip"

      - name: Upload official tagged release candidate
        if: startsWith(github.ref, 'refs/tags/v') && matrix.release_builder
        uses: actions/upload-artifact@v7
        with:
          name: blender-agent-bridge-official-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  pypi-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mcp-smoke, blender-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stop before any public deployment if the PyPI name is unavailable
        run: python scripts/check_pypi_name.py

  prepare-publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download official release candidate
        uses: actions/download-artifact@v7
        with:
          name: blender-agent-bridge-official-release-candidate
          path: dist

      - name: Build Pages repository from the official archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('addon/claude_blender/blender_manifest.toml','rb'))['version'])")
          python scripts/build_extension_repository.py \
            --zip-path "dist/claude_blender-${version}.zip" \
            --repo-dir public \
            --repository-url https://callmejones.github.io/blender-agent-bridge/index.json
          python tests/smoke_release_artifact_identity.py

      - name: Upload tagged extension repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: blender-agent-bridge-extension-repository-${{ github.ref_name }}
          path: |
            public/index.json
            public/index.html
            public/*.zip
            public/*.sha256
            public/assets/**
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-publication, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prepare-publication
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/blender-bridge/
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tagged blender-bridge publication candidate
        uses: actions/download-artifact@v7
        with:
          name: blender-bridge-official-python-candidate
          path: dist

      - name: Verify PyPI ownership and tested artifact publication state
        id: pypi-preflight
        run: >
          python scripts/check_pypi_name.py
          --dist-dir dist
          --version "${{ github.ref_name }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish blender-bridge with PyPI Trusted Publishing
        if: steps.pypi-preflight.outputs.publish_required == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true

      - name: Verify the complete PyPI artifact set after publication
        run: >
          python scripts/check_pypi_name.py
          --dist-dir dist
          --version "${{ github.ref_name }}"
          --require-complete
          --attempts 12
          --delay 5

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-publication, deploy-pages, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download official release candidate
        uses: actions/download-artifact@v7
        with:
          name: blender-agent-bridge-official-release-candidate
          path: dist

      - name: Download blender-bridge Python distributions
        uses: actions/download-artifact@v7
        with:
          name: blender-bridge-official-python-candidate
          path: python-dist

      - name: Download MCPB connector
        uses: actions/download-artifact@v7
        with:
          name: blender-agent-bridge-official-mcpb-candidate
          path: mcpb-dist

      - name: Publish tagged GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            python-dist/*.whl
            python-dist/*.tar.gz
            mcpb-dist/*.mcpb
            mcpb-dist/*.mcpb.sha256

  verify-publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-pages, publish-pypi, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tested MCPB publication candidate
        uses: actions/download-artifact@v7
        with:
          name: blender-agent-bridge-official-mcpb-candidate
          path: mcpb-dist

      - name: Verify public Pages and Release artifact identity
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tests/smoke_published_release_identity.py \
            --expected-mcpb-sidecar "mcpb-dist/blender-agent-bridge-${version}.mcpb.sha256" \
            --attempts 30 \
            --delay 5
